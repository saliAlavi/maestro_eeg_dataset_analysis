# Short-window modality sweep, group 3. Within-subject, per-window decisions,
# so these rows are directly comparable to the w5..w30 sweep and to the
# benchmark's per-window table. Split into groups only so each array task fits
# its walltime; all groups share the same data build and the same folds.
name: merit
device: auto
protocols: [within]
max_folds: null
folds: null
certify: false
save_models: false
variants:
  - name: eeg_flow
    model: {time_mods: [eeg, video], static_mods: [], orientation: [eeg, video]}
  - name: eeg_fovea
    model: {time_mods: [eeg], static_mods: [fovea], orientation: [eeg, fovea]}
  - name: all
    model: {time_mods: [eeg, gaze, imu, video], static_mods: [fovea],
            orientation: [eeg, gaze, imu, video, fovea]}
