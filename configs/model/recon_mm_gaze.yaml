name: recon_mm_gaze
d_model: 128
dropout: 0.2
w_cls: 1.0
w_recon: 1.0
fusion: gated        # gated (late, default) | film (late + EEG-token FiLM)
gaze_dropout: 0.2    # train-time gaze modality dropout -> keeps EEG path strong, fair no_gaze eval
train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  num_workers: 4
  grad_clip: 1.0
  log_every: 20
