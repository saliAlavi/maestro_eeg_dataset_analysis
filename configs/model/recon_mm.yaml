name: recon_mm
d_model: 128
dropout: 0.2
w_cls: 1.0          # weight on the attended-source classification (CE over corr scores)
w_recon: 1.0        # weight on EEG->attended-envelope reconstruction (MSE + 1-corr)
train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  num_workers: 4
  grad_clip: 1.0
  log_every: 20
