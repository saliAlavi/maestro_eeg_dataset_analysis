name: eeg_spatial
d_model: 64
dropout: 0.3
F1: 16          # learned temporal (band) filters
D: 2            # spatial filters per band
train:
  epochs: 60
  lr: 0.001
  weight_decay: 0.001    # power features overfit easily on small data -> stronger WD
  batch_size: 64
  num_workers: 4
  grad_clip: 1.0
  log_every: 20
