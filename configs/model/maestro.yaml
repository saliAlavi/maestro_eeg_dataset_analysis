name: maestro
d_model: 128
n_heads: 4
n_ctx_layers: 3
dropout: 0.2
n_subjects: 16
modality_dropout: 0.3
w_match: 1.0
w_info: 0.3
w_recon: 0.3
w_adv_gaze: 0.2
info_temp: 0.1
adv_lambda: 1.0
train:
  epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  num_workers: 4
  grad_clip: 1.0
  log_every: 20
