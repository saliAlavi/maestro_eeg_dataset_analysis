name: source_net
d_model: 96
dropout: 0.3
F1: 12            # CSP temporal filters per scale branch
D: 2             # spatial filters per band
K: 8             # content-match components
content_ksize: 17
max_lag: 32      # ±500 ms lag search for the content branch
lag_temp: 0.5
gaze_dropout: 0.2
label_smoothing: 0.05
augment: false   # train-time EEG augmentation (noise + channel-dropout + time-mask)
train:
  epochs: 80
  lr: 0.001
  weight_decay: 0.001
  batch_size: 64
  num_workers: 4
  grad_clip: 1.0
  log_every: 20
