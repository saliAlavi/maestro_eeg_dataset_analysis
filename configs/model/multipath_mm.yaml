name: multipath_mm
tag: ""               # appended to the wandb run name / scratch dir to label ablations
d_model: 128
dropout: 0.5         # heavy dropout: content paths memorised at 0.2 (train acc ~1.0, test ~chance)
paths: [env, w2v, sem, dir]   # any subset of {env, w2v, sem, dir}
w_aux: 1.0           # per-path cross-entropy (trains each branch / stage 1)
w_recon: 1.0         # EEG -> attended-representation reconstruction (content paths)
w_fuse: 1.0          # fusion CE; in multipath_mm the mixture is refit OUT-OF-FOLD on val (see model.fit)
train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.001   # 10x stronger to fight content-path overfitting
  batch_size: 64
  num_workers: 4
  grad_clip: 1.0
  log_every: 20
