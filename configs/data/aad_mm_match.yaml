name: aad
subjects: [1, 2, 3]
# REUSES the aad_recon cache (win5_sr64_b28_pwT_lp10). mm_task is materialise-time
# (NOT in the cache tag), so switching to permuted match-mismatch needs NO re-cache.
cache_dir: /fs/scratch/PAS2301/alialavi/cache/multimodal_aad__aad_recon
kind: main
n_folds: 5
overwrite_cache: false
seed: 0
split_mode: chrono_forward
window:
  win_s: 5.0
  sr: 64.0
  n_bands: 28
  overlap: 0.5
  audio_norm: table_power      # loudness-equalised -> match cannot use loudness
  audio_level_norm: false
  lp_hz: 10.0                  # EEG + envelopes in the ~1-10 Hz cortical speech-tracking band
  hp_hz: 1.0
  norm_cand: true              # per-(talker,band) z-score -> envelope SHAPE, not level
  norm_eeg: false              # raw EEG -> in-model spatial filter + BatchNorm (deep_match lesson)
  mm_task: match               # candidates = PERMUTED real talkers 1..4; pick attended by envelope match
