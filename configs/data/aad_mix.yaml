name: aad
subjects: [1, 2, 3]
cache_dir: /fs/scratch/PAS2301/alialavi/cache/multimodal_aad__aad_recon
kind: main
n_folds: 5
overwrite_cache: false
seed: 0
split_mode: chrono_forward
window:
  win_s: 5.0
  sr: 64.0
  n_bands: 28
  overlap: 0.875            # ~4x more training windows (data scarcity is the suspected limiter)
  audio_norm: table_power
  audio_level_norm: false
  lp_hz: 10.0
  hp_hz: 1.0
  norm_cand: true
  norm_eeg: true
  mm_task: match            # permuted real talkers -> content-based, no direction shortcut
  audio_feats: true         # + HuBERT layer-9 (PCA) and GPT-2 surprisal candidate streams
  w2v_pca_dim: 64
